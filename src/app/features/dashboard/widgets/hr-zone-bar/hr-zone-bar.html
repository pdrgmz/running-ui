<span class="zone-bar" role="img" [attr.aria-label]="ariaLabel()">
  @if (segments().length > 0) {
    @for (segment of segments(); track segment.cls) {
      <span
        [class]="'zone-bar-seg ' + segment.cls"
        [style.flex-grow]="segment.percentage"
        [title]="segment.label + ' · ' + segment.percentage + '%'"
      ></span>
    }
  } @else {
    <span class="zone-bar-empty" title="Sin datos de FC"></span>
  }
</span>
