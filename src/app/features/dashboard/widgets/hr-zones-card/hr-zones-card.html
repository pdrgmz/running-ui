<article class="card-panel">
  <div class="card-header-bar">
    <span class="card-tag-badge">/ANALYTICS/HR-ZONES</span>
    <span class="zones-source">{{ isEstimated() ? 'FC MÁX. ESTIMADA' : 'FC MÁX. OBSERVADA' }}</span>
  </div>

  <div class="zones-hero">
    <span class="zones-hero-value">{{ maxHr() }}</span>
    <span class="zones-hero-text">
      <span class="zones-hero-title">BPM DE FC MÁXIMA</span>
    </span>
  </div>

  <div
    class="zone-scale"
    role="img"
    aria-label="Escala de las cinco zonas de frecuencia cardíaca"
  >
    <span class="zone-scale-seg z1"></span>
    <span class="zone-scale-seg z2"></span>
    <span class="zone-scale-seg z3"></span>
    <span class="zone-scale-seg z4"></span>
    <span class="zone-scale-seg z5"></span>
  </div>

  <div class="zone-rows">
    @for (row of zoneRows(); track row.label) {
      <div class="zone-row">
        <span [class]="'zone-dot ' + row.cls"></span>
        <span class="zone-name">{{ row.label }}</span>
        <span class="zone-pct">{{ row.pct }}</span>
        <span class="zone-bpm">{{ row.bpm }}</span>
      </div>
    }
  </div>
</article>
