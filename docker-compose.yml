services:
  running-ui:
    build:
      context: .
      dockerfile: Dockerfile
    # Sin "image:" a propósito: la imagen se construye en local desde el
    # Dockerfile. Si se declara un nombre (p. ej. running-ui:latest), Compose y
    # el "pull" previo que hace Portainer al desplegar intentan descargarlo de
    # un registry y fallan con "pull access denied for running-ui".
    # El nombre resultante es <stack>-running-ui (p. ej. running-ui-running-ui).
    pull_policy: build
    restart: unless-stopped
    ports:
      # APP_PORT es el puerto del host; 80 es el puerto interno de Nginx.
      - "${APP_PORT:-3000}:80"
    environment:
      # Upstream de /api/*. Sin barra final.
      API_UPSTREAM: "${API_UPSTREAM:-https://running-api.pdrgmz.uk}"
